apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: rust-api
  namespace: so1-proyecto3
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck: {port: 8080, requestPath: /health}
  targetRef:
    group: ""
    kind: Service
    name: rust-api
