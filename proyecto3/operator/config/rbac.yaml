apiVersion: v1
kind: Namespace
metadata: {name: mum-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mum-operator, namespace: mum-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: mum-operator}
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, pods, persistentvolumeclaims, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [so1.usac.edu.gt]
    resources: [valkeyinstances, valkeyinstances/status, grafanainstances, grafanainstances/status]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: mum-operator}
subjects: [{kind: ServiceAccount, name: mum-operator, namespace: mum-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mum-operator}
