apiVersion: v1
kind: Service
metadata: {name: go-api, namespace: so1-proyecto3}
spec:
  selector: {app: go-entry}
  ports: [{name: http, port: 8081, targetPort: api}]
---
apiVersion: v1
kind: Service
metadata: {name: grpc-client, namespace: so1-proyecto3}
spec:
  selector: {app: go-entry}
  ports: [{name: http, port: 8082, targetPort: client}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: go-entry, namespace: so1-proyecto3}
spec:
  replicas: 1
  selector: {matchLabels: {app: go-entry}}
  template:
    metadata: {labels: {app: go-entry}}
    spec:
      containers:
        - name: go-api
          image: zot.example.com:5000/so1/go-api:v1
          ports: [{name: api, containerPort: 8081}]
          envFrom: [{configMapRef: {name: mum-config}}]
          readinessProbe: {httpGet: {path: /health, port: api}, initialDelaySeconds: 3, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
        - name: grpc-client
          image: zot.example.com:5000/so1/grpc-client:v1
          ports: [{name: client, containerPort: 8082}]
          envFrom: [{configMapRef: {name: mum-config}}]
          readinessProbe: {httpGet: {path: /health, port: client}, initialDelaySeconds: 3, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: grpc-server, namespace: so1-proyecto3}
spec:
  selector: {app: go-processing}
  ports: [{name: grpc, port: 50051, targetPort: grpc}]
---
apiVersion: v1
kind: Service
metadata: {name: rabbit-writer, namespace: so1-proyecto3}
spec:
  selector: {app: go-processing}
  ports: [{name: http, port: 8083, targetPort: writer}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: go-processing, namespace: so1-proyecto3}
spec:
  replicas: 1
  selector: {matchLabels: {app: go-processing}}
  template:
    metadata: {labels: {app: go-processing}}
    spec:
      containers:
        - name: grpc-server
          image: zot.example.com:5000/so1/grpc-server:v1
          ports: [{name: grpc, containerPort: 50051}]
          envFrom: [{configMapRef: {name: mum-config}}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
        - name: rabbit-writer
          image: zot.example.com:5000/so1/rabbit-writer:v1
          ports: [{name: writer, containerPort: 8083}]
          env:
            - {name: HTTP_ADDR, value: ":8083"}
            - name: RABBITMQ_QUEUE
              valueFrom: {configMapKeyRef: {name: mum-config, key: RABBITMQ_QUEUE}}
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: mum-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: mum-secrets, key: RABBITMQ_PASSWORD}}
            - {name: AMQP_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"}
          readinessProbe: {httpGet: {path: /health, port: writer}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
