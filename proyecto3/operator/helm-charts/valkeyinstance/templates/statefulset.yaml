apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ .Release.Name }}}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: valkey
          image: {{ .Values.image | quote }}
          args: ["valkey-server", "--appendonly", "yes"]
          ports: [{name: valkey, containerPort: 6379}]
          readinessProbe: {exec: {command: [valkey-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.storage | quote }}}}
