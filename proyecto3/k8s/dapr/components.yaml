apiVersion: dapr.io/v1alpha1
kind: Component
metadata: {name: rabbitmq-pubsub, namespace: so1-proyecto3}
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - {name: host, secretKeyRef: {name: dapr-rabbitmq, key: connectionString}}
    - {name: durable, value: "true"}
    - {name: deletedWhenUnused, value: "false"}
auth:
  secretStore: kubernetes
---
apiVersion: v1
kind: Secret
metadata: {name: dapr-rabbitmq, namespace: so1-proyecto3}
type: Opaque
stringData:
  connectionString: amqp://so1:CAMBIAR_ANTES_DE_GKE@rabbitmq:5672/
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata: {name: war-reports, namespace: so1-proyecto3}
spec:
  pubsubname: rabbitmq-pubsub
  topic: war-reports
  routes: {default: /dapr/war-reports}
scopes: [dapr-consumer]
