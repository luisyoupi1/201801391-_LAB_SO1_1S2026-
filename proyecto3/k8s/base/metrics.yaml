apiVersion: v1
kind: Service
metadata: {name: metrics-exporter, namespace: so1-proyecto3}
spec:
  selector: {app: metrics-exporter}
  ports: [{name: metrics, port: 9106, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: metrics-exporter, namespace: so1-proyecto3}
spec:
  replicas: 1
  selector: {matchLabels: {app: metrics-exporter}}
  template:
    metadata: {labels: {app: metrics-exporter}}
    spec:
      containers:
        - name: metrics-exporter
          image: zot.example.com:5000/so1/metrics-exporter:v1
          ports: [{name: metrics, containerPort: 9106}]
          envFrom: [{configMapRef: {name: mum-config}}]
          readinessProbe: {httpGet: {path: /health, port: metrics}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: so1-proyecto3}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    scrape_configs:
      - job_name: mum
        static_configs: [{targets: ["metrics-exporter:9106"]}]
      - job_name: rust-api
        static_configs: [{targets: ["rust-api:8080"]}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: so1-proyecto3}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: so1-proyecto3}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: config, configMap: {name: prometheus-config}}]
