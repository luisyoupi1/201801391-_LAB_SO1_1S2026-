apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-provisioning}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-mum
        access: proxy
        url: {{ .Values.prometheusUrl }}
        isDefault: true
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: MUM
        folder: Proyecto 3
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-dashboard}
data:
  mum.json: |
{{ .Files.Get "files/mum-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ .Release.Name }}}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.image | quote }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.adminSecret }}, key: GRAFANA_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.adminSecret }}, key: GRAFANA_ADMIN_PASSWORD}}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml, subPath: dashboard.yml}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: provisioning, configMap: {name: {{ .Release.Name }}-provisioning}}
        - {name: dashboard, configMap: {name: {{ .Release.Name }}-dashboard}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.storage | quote }}}}
