apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: grafanainstances.so1.usac.edu.gt}
spec:
  group: so1.usac.edu.gt
  names: {kind: GrafanaInstance, listKind: GrafanaInstanceList, plural: grafanainstances, singular: grafanainstance, shortNames: [gfi]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image: {type: string}
                storage: {type: string, pattern: "^[0-9]+(Mi|Gi)$"}
                prometheusUrl: {type: string}
                adminSecret: {type: string}
              required: [image, storage, prometheusUrl, adminSecret]
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
