apiVersion: v1
kind: Service
metadata: {name: rust-api, namespace: so1-proyecto3}
spec:
  selector: {app: rust-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rust-api, namespace: so1-proyecto3}
spec:
  replicas: 1
  selector: {matchLabels: {app: rust-api}}
  template:
    metadata: {labels: {app: rust-api}}
    spec:
      containers:
        - name: rust-api
          image: zot.example.com:5000/so1/rust-api:v1
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: mum-config}}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: rust-api, namespace: so1-proyecto3}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rust-api}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 30}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}
